name: 🧪 Daily Playwright Tests at 12 PM

on:
  schedule:
    # Run at 9:00 AM UTC every day (12 PM local time for UTC+3)
    # Adjust the hour if you're in a different timezone:
    # UTC-8 (PST): 20 (8 PM previous day)
    # UTC-5 (EST): 17 (5 PM previous day)
    # UTC+0 (GMT): 12 (noon)
    # UTC+1 (CET): 11 (11 AM)
    # UTC+3 (Your timezone): 9 (9 AM UTC = 12 PM your local)
    - cron: '0 9 * * *'
  
  # Also allow manual trigger
  workflow_dispatch:
    inputs:
      debug_enabled:
        description: 'Enable debug logging'
        required: false
        default: false

jobs:
  test:
    name: 🎭 Run Playwright Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🔍 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: 📦 Install dependencies
        run: |
          npm ci
          npx playwright install --with-deps

      - name: 🧪 Run Playwright tests
        env:
          BASE_URL: ${{ secrets.BASE_URL }}
          USERNAME: ${{ secrets.TEST_USERNAME }}
          PASSWORD: ${{ secrets.TEST_PASSWORD }}
        run: npx playwright test --reporter=html --reporter=json

      - name: 📊 Upload test report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30

      - name: 📁 Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-json
          path: test-results/
          retention-days: 30

      - name: 📈 Test Summary
        if: always()
        run: |
          echo "## ✅ Test Execution Complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Run Details:**" >> $GITHUB_STEP_SUMMARY
          echo "- **Date**: $(date)" >> $GITHUB_STEP_SUMMARY
          echo "- **Status**: ${{ job.status }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Duration**: ${{ job.elapsed_time }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "📊 **Reports Available:**" >> $GITHUB_STEP_SUMMARY
          echo "- HTML Report: See 'Artifacts' section below" >> $GITHUB_STEP_SUMMARY
          echo "- JSON Results: See 'Artifacts' section below" >> $GITHUB_STEP_SUMMARY

      - name: ✅ Notify on success
        if: success()
        run: |
          echo "🎉 All tests passed!"
          echo "📊 View reports in the 'Artifacts' section of this workflow run"

      - name: ❌ Notify on failure
        if: failure()
        run: |
          echo "⚠️ Some tests failed!"
          echo "📊 Check the HTML report in Artifacts for details"
          echo "🔍 Failed test logs are available above"
