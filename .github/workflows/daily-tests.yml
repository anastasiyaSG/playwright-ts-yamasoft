name: 🧪 Daily Playwright Tests at 12 PM

on:
  schedule:
    # Run at 9:00 AM UTC every day (12 PM local time for UTC+3)
    - cron: '0 9 * * *'
  
  # Also allow manual trigger
  workflow_dispatch:

jobs:
  test:
    name: 🎭 Run Playwright Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🔍 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: 📦 Install dependencies
        run: npm install

      - name: 🌐 Install Playwright browsers
        run: npx playwright install --with-deps chromium firefox webkit

      - name: 🧪 Run Playwright tests
        env:
          BASE_URL: ${{ secrets.BASE_URL }}
          USERNAME: ${{ secrets.TEST_USERNAME }}
          PASSWORD: ${{ secrets.TEST_PASSWORD }}
        run: npx playwright test --reporter=html,json,list

      - name: 📊 Upload HTML report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30

      - name: 📁 Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-json
          path: test-results/
          retention-days: 30

      - name: ✅ Test Summary
        if: always()
        run: |
          echo "## ✅ Playwright Tests Completed" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Status:** ${{ job.status }}" >> $GITHUB_STEP_SUMMARY
          echo "**Date:** $(date)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 📊 Reports Available:" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ HTML Report: Download from Artifacts" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ JSON Results: Download from Artifacts" >> $GITHUB_STEP_SUMMARY
